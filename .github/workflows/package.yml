name: Package HealBot

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build addon archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/HealBot"
          rsync -a --exclude '.git' --exclude '.github' ./ "$RUNNER_TEMP/HealBot/"
          (
            cd "$RUNNER_TEMP"
            zip -r "$GITHUB_WORKSPACE/HealBot.zip" HealBot
          )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: HealBot.zip
          generate_release_notes: true
